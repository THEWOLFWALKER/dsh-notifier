name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  test:
    # 三平台矩阵：插件零原生模块/零系统命令，兼容面 = Node ≥22 的平台矩阵
    # （对齐并覆盖 DSH 宿主可能在的 macOS / Windows / Linux）。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # headless windows cannot run desktop toast (dropped 08-18)
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --version
      # 零运行时依赖：无需 npm install，直接跑 node:test
      # 显式钉到 test/ 下两种命名：默认发现 glob（test-*）会误吞 scripts/test-channel.mjs
      # （node --test 自 v21 起原生支持 glob 模式，Windows 上不经 shell 展开也能匹配）
      - name: Run tests
        run: node --test "test/*.test.mjs" "test/*.spec.mjs"
      - name: Verify zero runtime dependencies
        shell: bash # if [ -f ... ] 是 bash 语法，Windows runner 默认 pwsh 需显式指定
        run: |
          if [ -f package-lock.json ]; then npm ls --prod --all; fi
          node -e "const p=require('./package.json'); const deps=Object.keys(p.dependencies??{}); if(deps.length>0){console.error('发现运行时依赖:',deps);process.exit(1)} console.log('OK: 零运行时依赖')"
      - name: Regenerate channel matrix (check README drift)
        run: node scripts/gen-channel-matrix.mjs --check

  client:
    # 浏览器产物 `lib/client.js` 是 generated + committed（消费方不构建已发布包）。
    # 这个 job 重放构建并逐字节比对，专门抓「改了 plugin-src 忘了重建 / 重建了忘了提交」的漂移。
    # 它是本仓库唯一需要 npm install 的地方：esbuild 是 build-only devDependency，
    # test job 仍然零安装直跑 node --test。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --no-package-lock：项目策略禁止 lockfile（Node 不做版本锁定，esbuild 已在 package.json 精确钉版本）
      - name: Install build-only devDependency
        run: npm install --no-package-lock --ignore-scripts
      - name: Fail if a lockfile appeared
        shell: bash
        run: |
          if [ -f package-lock.json ]; then echo "package-lock.json must not exist after install"; exit 1; fi
          echo "OK: no lockfile"
      - name: Rebuild the browser artifact and fail on drift
        shell: bash
        run: |
          npm run build:client
          if ! git diff --exit-code -- lib/client.js; then
            echo "lib/client.js is stale: run \`npm run build:client\` and commit the artifact"
            exit 1
          fi
          echo "OK: lib/client.js matches a fresh build"
      - name: Verify the browser artifact contract
        run: npm run verify:client
